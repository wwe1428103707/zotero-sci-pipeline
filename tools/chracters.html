<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据仪表盘 · 交互动画角色</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: #f6f8fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============ DEMO 容器 ============ */
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 40px;
    }

    .demo-container h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1f2328;
    }

    .demo-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .demo-controls button {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #d0d7de;
      background: #fff;
      color: #1f2328;
      cursor: pointer;
      transition: all .15s;
    }
    .demo-controls button:hover { background: #f3f4f6; border-color: #8b949e; }

    /* ============ 角色场景（唯一保留的视觉结构） ============ */
    .characters-scene {
      position: relative;
      width: 480px;
      height: 360px;
    }

    .character {
      position: absolute;
      bottom: 0;
      transition: all 0.7s ease-in-out;
      transform-origin: bottom center;
    }

    .char-purple { left: 60px; width: 170px; height: 370px; background: #6c3ff5; border-radius: 10px 10px 0 0; z-index: 1; }
    .char-black  { left: 220px; width: 115px; height: 290px; background: #2d2d2d; border-radius: 8px 8px 0 0; z-index: 2; }
    .char-orange { left: 0; width: 230px; height: 190px; background: #ff9b6b; border-radius: 115px 115px 0 0; z-index: 3; }
    .char-yellow { left: 290px; width: 135px; height: 215px; background: #e8d754; border-radius: 68px 68px 0 0; z-index: 4; }

    .eyes {
      position: absolute;
      display: flex;
      transition: all 0.7s ease-in-out;
    }

    .eyeball {
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease;
      overflow: hidden;
    }
    .pupil {
      border-radius: 50%;
      background: #2d2d2d;
      transition: transform 0.1s ease-out;
    }
    .bare-pupil {
      width: 12px; height: 12px; border-radius: 50%;
      background: #2d2d2d; transition: transform 0.7s ease-in-out;
    }

    .orange-mouth {
      position: absolute;
      width: 28px; height: 14px;
      border: 3px solid #2d2d2d; border-top: none;
      border-radius: 0 0 14px 14px;
      opacity: 0;
      transition: all 0.7s ease-in-out;
    }
    .orange-mouth.visible { opacity: 1; }

    .yellow-mouth {
      position: absolute;
      width: 50px; height: 4px;
      background: #2d2d2d; border-radius: 2px;
      transition: all 0.7s ease-in-out;
    }

    /* ============ 动画关键帧 ============ */

    /* 摇头（原版保留） */
    @keyframes shakeHead {
      0%,100% { translate: 0 0; }
      10%  { translate: -9px 0; }
      20%  { translate: 7px 0; }
      30%  { translate: -6px 0; }
      40%  { translate: 5px 0; }
      50%  { translate: -4px 0; }
      60%  { translate: 3px 0; }
      70%  { translate: -2px 0; }
      80%  { translate: 1px 0; }
      90%  { translate: -0.5px 0; }
    }
    .eyes.shake-head, .yellow-mouth.shake-head, .orange-mouth.shake-head {
      animation: shakeHead 0.8s cubic-bezier(0.36,0.07,0.19,0.97) both;
    }

    /* 轻点头 — 橙色角色在浏览场景下周期性使用 */
    @keyframes gentleNod {
      0%,100% { transform: translateY(0) skewX(0deg); }
      30%  { transform: translateY(-3px) skewX(1deg); }
      60%  { transform: translateY(0) skewX(0deg); }
    }

    /* 思考摆动 — 黄色角色在编辑场景下使用 */
    @keyframes thinkSway {
      0%,100% { transform: skewX(0deg); }
      25% { transform: skewX(2deg); }
      75% { transform: skewX(-1.5deg); }
    }

    /* 轻快弹跳 — 保存成功 / 加载完成 */
    @keyframes bounceUp {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(-10px); }
      50%  { transform: translateY(-6px); }
      70%  { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }

    /* 专注微动 — 嘴唇轻微颤动 */
    @keyframes lipQuiver {
      0%,100% { height: 4px; }
      25%  { height: 2px; }
      75%  { height: 3px; }
    }

    /* 查看场景：倾斜探视（在 scroll 期间短时附加） */
    @keyframes leanForward {
      0%,100% { transform: skewX(2deg); }
      50% { transform: skewX(6deg); }
    }
    .character.lean-forward {
      animation: leanForward 1.2s ease-in-out;
    }
  </style>
</head>
<body>
  <!-- ============ DEMO 操作区 ============ -->
  <div class="demo-container">
    <h2>角色动画演示面板</h2>
    <div class="demo-controls">
      <button onclick="window.__characters.doScrollDown()">&#8595; 向下滚动</button>
      <button onclick="window.__characters.doScrollUp()">&#8593; 向上滚动</button>
      <button onclick="window.__characters.doBrowseContent()">&#128214; 浏览内容</button>
      <button onclick="window.__characters.doInfoCheck()">&#128269; 核对信息</button>
      <button onclick="window.__characters.doEditFocus()">&#9998; 开始编辑</button>
      <button onclick="window.__characters.doEditBlur()">&#9997; 结束编辑</button>
      <button onclick="window.__characters.doSaveSuccess()">&#10003; 保存成功</button>
      <button onclick="window.__characters.doSaveError()">&#10007; 保存失败</button>
      <button onclick="window.__characters.doNavSwitch()">&#9733; 切换页面</button>
      <button onclick="window.__characters.doPipelineRunning(true)">&#9654; 管线运行</button>
      <button onclick="window.__characters.doPipelineRunning(false)">&#9632; 管线结束</button>
    </div>
    <!-- ============ 角色场景（结构和样式完整保持原版） ============ -->
    <div class="characters-scene" id="characters-scene">
      <div class="character char-purple" id="char-purple">
        <div class="eyes" id="purple-eyes" style="left:45px;top:40px;gap:28px">
          <div class="eyeball" id="purple-eye-l" style="width:18px;height:18px">
            <div class="pupil" id="purple-pupil-l" style="width:7px;height:7px"></div>
          </div>
          <div class="eyeball" id="purple-eye-r" style="width:18px;height:18px">
            <div class="pupil" id="purple-pupil-r" style="width:7px;height:7px"></div>
          </div>
        </div>
      </div>
      <div class="character char-black" id="char-black">
        <div class="eyes" id="black-eyes" style="left:26px;top:32px;gap:20px">
          <div class="eyeball" id="black-eye-l" style="width:16px;height:16px">
            <div class="pupil" id="black-pupil-l" style="width:6px;height:6px"></div>
          </div>
          <div class="eyeball" id="black-eye-r" style="width:16px;height:16px">
            <div class="pupil" id="black-pupil-r" style="width:6px;height:6px"></div>
          </div>
        </div>
      </div>
      <div class="character char-orange" id="char-orange">
        <div class="eyes" id="orange-eyes" style="left:82px;top:90px;gap:28px">
          <div class="bare-pupil" id="orange-pupil-l"></div>
          <div class="bare-pupil" id="orange-pupil-r"></div>
        </div>
        <div class="orange-mouth" id="orange-mouth" style="left:90px;top:120px"></div>
      </div>
      <div class="character char-yellow" id="char-yellow">
        <div class="eyes" id="yellow-eyes" style="left:52px;top:40px;gap:20px">
          <div class="bare-pupil" id="yellow-pupil-l"></div>
          <div class="bare-pupil" id="yellow-pupil-r"></div>
        </div>
        <div class="yellow-mouth" id="yellow-mouth" style="left:40px;top:88px"></div>
      </div>
    </div>
  </div>

  <script>
    // ========================================================================
    //  角色动画系统 — 针对仪表盘/配置面板场景优化
    //  原版（animatedlogin）中的密码输入/偷看/表单校验逻辑已全部移除，
    //  替换为：查看场景（滚动/浏览/核对）、编辑场景（输入/保存/格式调整）、
    //  系统场景（页面切换/管线运行/加载成功/失败）三类动画序列。
    // ========================================================================

    (function initCharacters() {
      // ---------- DOM 缓存 ----------
      const purple = document.getElementById("char-purple");
      const black = document.getElementById("char-black");
      const orange = document.getElementById("char-orange");
      const yellow = document.getElementById("char-yellow");

      const purpleEyes = document.getElementById("purple-eyes");
      const purpleEyeL = document.getElementById("purple-eye-l");
      const purpleEyeR = document.getElementById("purple-eye-r");
      const purplePupilL = document.getElementById("purple-pupil-l");
      const purplePupilR = document.getElementById("purple-pupil-r");

      const blackEyes = document.getElementById("black-eyes");
      const blackEyeL = document.getElementById("black-eye-l");
      const blackEyeR = document.getElementById("black-eye-r");
      const blackPupilL = document.getElementById("black-pupil-l");
      const blackPupilR = document.getElementById("black-pupil-r");

      const orangeEyes = document.getElementById("orange-eyes");
      const orangePupilL = document.getElementById("orange-pupil-l");
      const orangePupilR = document.getElementById("orange-pupil-r");
      const orangeMouth = document.getElementById("orange-mouth");

      const yellowEyes = document.getElementById("yellow-eyes");
      const yellowPupilL = document.getElementById("yellow-pupil-l");
      const yellowPupilR = document.getElementById("yellow-pupil-r");
      const yellowMouth = document.getElementById("yellow-mouth");

      const scene = document.getElementById("characters-scene");

      // ---------- 状态 ----------
      let mouseX = 0, mouseY = 0;
      let isPurpleBlinking = false;
      let isBlackBlinking = false;

      // 各场景当前激活态（优先级：error > pipeline > editing > viewing > idle）
      let activeScene = "idle";           // idle | viewing | editing | error | pipeline
      let isErrorActive = false;
      let isPipelineRunning = false;
      let editFocusTimer = null;
      let sceneTransitionTimer = null;

      // 查看场景子状态
      let scrollDirection = 0;            // -1(上) | 0(无) | 1(下)
      let isBrowsingContent = false;
      let isInfoChecking = false;

      // ---------- 工具函数 ----------

      function calcPosition(el) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 3;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        return {
          faceX: Math.max(-15, Math.min(15, dx / 20)),
          faceY: Math.max(-10, Math.min(10, dy / 30)),
          bodySkew: Math.max(-6, Math.min(6, -dx / 120)),
        };
      }

      function calcPupilOffset(el, maxOffset) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 60);
        const angle = Math.atan2(dy, dx);
        const offset = Math.min(dist / 60, 1) * maxOffset;
        return { x: Math.cos(angle) * offset, y: Math.sin(angle) * offset };
      }

      function resetAllTransforms(keepTransition) {
        if (!keepTransition) {
          // 短暂禁用 transition 以便立即重置
          [purple, black, orange, yellow].forEach(el => el.style.transition = "none");
        }
        purple.style.transform = "";
        purple.style.height = "";
        black.style.transform = "";
        orange.style.transform = "";
        yellow.style.transform = "";

        purpleEyes.style.left = "";
        purpleEyes.style.top = "";
        blackEyes.style.left = "";
        blackEyes.style.top = "";
        orangeEyes.style.left = "";
        orangeEyes.style.top = "";
        yellowEyes.style.left = "";
        yellowEyes.style.top = "";

        yellowMouth.style.left = "";
        yellowMouth.style.top = "";
        yellowMouth.style.transform = "";
        orangeMouth.style.left = "";

        purplePupilL.style.transform = "";
        purplePupilR.style.transform = "";
        blackPupilL.style.transform = "";
        blackPupilR.style.transform = "";
        orangePupilL.style.transform = "";
        orangePupilR.style.transform = "";
        yellowPupilL.style.transform = "";
        yellowPupilR.style.transform = "";

        void document.body.offsetHeight;
        if (!keepTransition) {
          [purple, black, orange, yellow].forEach(el => el.style.transition = "");
        }
      }

      // ---------- 眨眼（原版保留） ----------
      function scheduleBlinkPurple() {
        setTimeout(() => {
          isPurpleBlinking = true;
          updateCharacters();
          setTimeout(() => {
            isPurpleBlinking = false;
            updateCharacters();
            scheduleBlinkPurple();
          }, 150);
        }, Math.random() * 4000 + 3000);
      }
      function scheduleBlinkBlack() {
        setTimeout(() => {
          isBlackBlinking = true;
          updateCharacters();
          setTimeout(() => {
            isBlackBlinking = false;
            updateCharacters();
            scheduleBlinkBlack();
          }, 150);
        }, Math.random() * 4000 + 3000);
      }
      scheduleBlinkPurple();
      scheduleBlinkBlack();

      // ---------- 鼠标追踪 ----------
      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (activeScene === "idle" || activeScene === "viewing") {
          updateCharacters();
        }
      });

      // ================================================================
      //  核心更新函数：按场景优先级调度
      // ================================================================
      function updateCharacters() {
        // 眨眼始终生效（独立于场景）
        purpleEyeL.style.height = isPurpleBlinking ? "2px" : "18px";
        purpleEyeR.style.height = isPurpleBlinking ? "2px" : "18px";
        blackEyeL.style.height = isBlackBlinking ? "2px" : "16px";
        blackEyeR.style.height = isBlackBlinking ? "2px" : "16px";

        // 场景优先级：error > pipeline > editing > viewing > idle
        if (isErrorActive) {
          applyErrorPose();
          return;
        }
        if (isPipelineRunning) {
          applyPipelinePose();
          return;
        }
        if (activeScene === "editing") {
          applyEditingPose();
          return;
        }
        if (activeScene === "viewing") {
          applyViewingPose();
          return;
        }
        // idle — 默认鼠标追踪
        applyIdlePose();
      }

      // ================================================================
      //  场景姿势函数
      // ================================================================

      // --- idle：鼠标追踪 ---
      function applyIdlePose() {
        const pPos = calcPosition(purple);
        const bPos = calcPosition(black);
        const oPos = calcPosition(orange);
        const yPos = calcPosition(yellow);

        purple.style.transform = `skewX(${pPos.bodySkew}deg)`;
        black.style.transform = `skewX(${bPos.bodySkew}deg)`;
        orange.style.transform = `skewX(${oPos.bodySkew}deg)`;
        yellow.style.transform = `skewX(${yPos.bodySkew}deg)`;

        purpleEyes.style.left = 45 + pPos.faceX + "px";
        purpleEyes.style.top = 40 + pPos.faceY + "px";
        blackEyes.style.left = 26 + bPos.faceX + "px";
        blackEyes.style.top = 32 + bPos.faceY + "px";
        orangeEyes.style.left = 82 + oPos.faceX + "px";
        orangeEyes.style.top = 90 + oPos.faceY + "px";
        yellowEyes.style.left = 52 + yPos.faceX + "px";
        yellowEyes.style.top = 40 + yPos.faceY + "px";

        const po = calcPupilOffset(purpleEyeL, 5);
        purplePupilL.style.transform = `translate(${po.x}px,${po.y}px)`;
        purplePupilR.style.transform = `translate(${po.x}px,${po.y}px)`;
        const bo = calcPupilOffset(blackEyeL, 4);
        blackPupilL.style.transform = `translate(${bo.x}px,${bo.y}px)`;
        blackPupilR.style.transform = `translate(${bo.x}px,${bo.y}px)`;
        const oo = calcPupilOffset(orangePupilL, 5);
        orangePupilL.style.transform = `translate(${oo.x}px,${oo.y}px)`;
        orangePupilR.style.transform = `translate(${oo.x}px,${oo.y}px)`;
        const yo = calcPupilOffset(yellowPupilL, 5);
        yellowPupilL.style.transform = `translate(${yo.x}px,${yo.y}px)`;
        yellowPupilR.style.transform = `translate(${yo.x}px,${yo.y}px)`;

        yellowMouth.style.left = 40 + yPos.faceX + "px";
        yellowMouth.style.top = 88 + yPos.faceY + "px";
        yellowMouth.style.transform = "rotate(0deg)";
        orangeMouth.style.left = 90 + oPos.faceX + "px";
      }

      // --- viewing：查看场景 ---
      function applyViewingPose() {
        const pPos = calcPosition(purple);
        const bPos = calcPosition(black);
        const oPos = calcPosition(orange);
        const yPos = calcPosition(yellow);

        // 滚动偏移：向下滚 = 前倾，向上滚 = 后仰
        const scrollLean = scrollDirection * 4;
        const scrollFaceY = scrollDirection * 3;

        purple.style.transform = `skewX(${pPos.bodySkew + scrollLean}deg)`;
        black.style.transform = `skewX(${bPos.bodySkew + scrollLean}deg)`;
        orange.style.transform = `skewX(${oPos.bodySkew + scrollLean}deg)`;
        yellow.style.transform = `skewX(${yPos.bodySkew + scrollLean}deg)`;

        purpleEyes.style.left = 45 + pPos.faceX + "px";
        purpleEyes.style.top = 40 + pPos.faceY + scrollFaceY + "px";
        blackEyes.style.left = 26 + bPos.faceX + "px";
        blackEyes.style.top = 32 + bPos.faceY + scrollFaceY + "px";
        orangeEyes.style.left = 82 + oPos.faceX + "px";
        orangeEyes.style.top = 90 + oPos.faceY + scrollFaceY + "px";
        yellowEyes.style.left = 52 + yPos.faceX + "px";
        yellowEyes.style.top = 40 + yPos.faceY + scrollFaceY + "px";

        const po = calcPupilOffset(purpleEyeL, 5);
        purplePupilL.style.transform = `translate(${po.x}px,${po.y}px)`;
        purplePupilR.style.transform = `translate(${po.x}px,${po.y}px)`;
        const bo = calcPupilOffset(blackEyeL, 4);
        blackPupilL.style.transform = `translate(${bo.x}px,${bo.y}px)`;
        blackPupilR.style.transform = `translate(${bo.x}px,${bo.y}px)`;
        const oo = calcPupilOffset(orangePupilL, 5);
        orangePupilL.style.transform = `translate(${oo.x}px,${oo.y}px)`;
        orangePupilR.style.transform = `translate(${oo.x}px,${oo.y}px)`;
        const yo = calcPupilOffset(yellowPupilL, 5);
        yellowPupilL.style.transform = `translate(${yo.x}px,${yo.y}px)`;
        yellowPupilR.style.transform = `translate(${yo.x}px,${yo.y}px)`;

        yellowMouth.style.left = 40 + yPos.faceX + "px";
        yellowMouth.style.top = 88 + yPos.faceY + "px";
        yellowMouth.style.transform = "rotate(0deg)";
        orangeMouth.style.left = 90 + oPos.faceX + "px";
      }

      // --- editing：编辑场景 ---
      function applyEditingPose() {
        const pPos = calcPosition(purple);
        const bPos = calcPosition(black);

        // 紫色探身看输入内容，黑色微微前倾，橙色黄色保持追踪
        purple.style.transform = `skewX(${(pPos.bodySkew || 0) - 10}deg) translateX(30px)`;
        purple.style.height = "400px";
        black.style.transform = `skewX(${(bPos.bodySkew || 0) + 2}deg)`;
        // 黄色进入思考摆动（在编辑场景中持续微动）
        yellow.style.animation = "thinkSway 3s ease-in-out infinite";

        // 紫色眼睛聚焦（稍微向右下偏移，模拟注视文本输入区域）
        purpleEyes.style.left = 55 + pPos.faceX + "px";
        purpleEyes.style.top = 55 + pPos.faceY + "px";
        const po = calcPupilOffset(purpleEyeL, 5);
        purplePupilL.style.transform = `translate(${po.x + 2}px,${po.y + 3}px)`;
        purplePupilR.style.transform = `translate(${po.x + 2}px,${po.y + 3}px)`;

        // 黑色微微偏头看紫色方向
        blackEyes.style.left = 30 + bPos.faceX + "px";
        blackEyes.style.top = 28 + bPos.faceY + "px";
        const bo = calcPupilOffset(blackEyeL, 4);
        blackPupilL.style.transform = `translate(${bo.x + 1}px,${bo.y}px)`;
        blackPupilR.style.transform = `translate(${bo.x + 1}px,${bo.y}px)`;

        // 橙色保持普通追踪
        const oPos = calcPosition(orange);
        orangeEyes.style.left = 82 + oPos.faceX + "px";
        orangeEyes.style.top = 90 + oPos.faceY + "px";
        orange.style.transform = `skewX(${oPos.bodySkew}deg)`;
        orangeMouth.style.left = 90 + oPos.faceX + "px";

        // 黄色嘴唇微颤（专注）
        yellowMouth.style.animation = "lipQuiver 2s ease-in-out infinite";
        yellowMouth.style.left = "40px";
        yellowMouth.style.top = "88px";

        // 黄色眼球追踪
        const yPos = calcPosition(yellow);
        yellowEyes.style.left = 52 + yPos.faceX + "px";
        yellowEyes.style.top = 40 + yPos.faceY + "px";
        const yo = calcPupilOffset(yellowPupilL, 5);
        yellowPupilL.style.transform = `translate(${yo.x}px,${yo.y}px)`;
        yellowPupilR.style.transform = `translate(${yo.x}px,${yo.y}px)`;
      }

      // --- error：错误场景（橙色伤心 + 全体摇头） ---
      function applyErrorPose() {
        // 身体停止追踪
        purple.style.transform = "skewX(-2deg)";
        black.style.transform = "skewX(2deg)";
        orange.style.transform = "skewX(0deg)";
        yellow.style.transform = "skewX(0deg)";
        purple.style.height = "";
        yellow.style.animation = "";
        yellowMouth.style.animation = "";

        // 全体眼睛看左下
        purpleEyes.style.left = "30px";
        purpleEyes.style.top = "55px";
        blackEyes.style.left = "15px";
        blackEyes.style.top = "40px";
        orangeEyes.style.left = "60px";
        orangeEyes.style.top = "95px";
        yellowEyes.style.left = "35px";
        yellowEyes.style.top = "45px";

        purplePupilL.style.transform = "translate(-3px,4px)";
        purplePupilR.style.transform = "translate(-3px,4px)";
        blackPupilL.style.transform = "translate(-3px,4px)";
        blackPupilR.style.transform = "translate(-3px,4px)";
        orangePupilL.style.transform = "translate(-3px,4px)";
        orangePupilR.style.transform = "translate(-3px,4px)";
        yellowPupilL.style.transform = "translate(-3px,4px)";
        yellowPupilR.style.transform = "translate(-3px,4px)";

        yellowMouth.style.left = "30px";
        yellowMouth.style.top = "92px";
        yellowMouth.style.transform = "rotate(-8deg)";
        orangeMouth.style.left = "80px";
      }

      // --- pipeline：管线运行中 ---
      function applyPipelinePose() {
        // 全体保持专注姿态，黄色轻微摆动
        purple.style.transform = "skewX(3deg)";
        black.style.transform = "skewX(-2deg)";
        orange.style.transform = "skewX(2deg)";
        purple.style.height = "";
        yellow.style.animation = "thinkSway 2.5s ease-in-out infinite";
        yellowMouth.style.animation = "";

        purpleEyes.style.left = "50px";
        purpleEyes.style.top = "38px";
        blackEyes.style.left = "28px";
        blackEyes.style.top = "30px";
        orangeEyes.style.left = "85px";
        orangeEyes.style.top = "88px";
        yellowEyes.style.left = "55px";
        yellowEyes.style.top = "38px";

        const po = calcPupilOffset(purpleEyeL, 3);
        purplePupilL.style.transform = `translate(${po.x}px,${po.y}px)`;
        purplePupilR.style.transform = `translate(${po.x}px,${po.y}px)`;
        const bo = calcPupilOffset(blackEyeL, 3);
        blackPupilL.style.transform = `translate(${bo.x}px,${bo.y}px)`;
        blackPupilR.style.transform = `translate(${bo.x}px,${bo.y}px)`;

        orangePupilL.style.transform = "translate(0,0)";
        orangePupilR.style.transform = "translate(0,0)";
        yellowPupilL.style.transform = "translate(0,0)";
        yellowPupilR.style.transform = "translate(0,0)";

        yellowMouth.style.left = "40px";
        yellowMouth.style.top = "88px";
        yellowMouth.style.transform = "rotate(0deg)";
        orangeMouth.style.left = "90px";
      }

      // ================================================================
      //  公开 API — 供外部场景调用
      // ================================================================

      const shakeIds = [
        "purple-eyes", "black-eyes", "orange-eyes", "yellow-eyes",
        "yellow-mouth", "orange-mouth",
      ];

      function getShakeEls() {
        return shakeIds.map(id => document.getElementById(id));
      }

      function clearShake() {
        getShakeEls().forEach(el => el && el.classList.remove("shake-head"));
      }

      function triggerShake() {
        clearShake();
        void document.body.offsetHeight;
        getShakeEls().forEach(el => el && el.classList.add("shake-head"));
      }

      function stopShake() {
        clearShake();
      }

      // ---------- 场景切换辅助 ----------
      function setScene(scene) {
        if (sceneTransitionTimer) {
          clearTimeout(sceneTransitionTimer);
          sceneTransitionTimer = null;
        }
        // 退出旧场景时恢复默认过渡
        if (activeScene !== scene) {
          // 清除黄色上的持续性动画
          yellow.style.animation = "";
          yellowMouth.style.animation = "";
          yellowMouth.style.transform = "";
          // 清除摇头
          stopShake();
          // 隐藏橙色嘴巴
          orangeMouth.classList.remove("visible");
        }
        activeScene = scene;
      }

      // ---------- API: 查看场景 ----------

      function doScrollDown() {
        setScene("viewing");
        scrollDirection = 1;
        updateCharacters();
        // 短时后渐进恢复
        sceneTransitionTimer = setTimeout(() => {
          scrollDirection = 0;
          setScene("idle");
          updateCharacters();
        }, 2000);
      }

      function doScrollUp() {
        setScene("viewing");
        scrollDirection = -1;
        updateCharacters();
        sceneTransitionTimer = setTimeout(() => {
          scrollDirection = 0;
          setScene("idle");
          updateCharacters();
        }, 2000);
      }

      function doBrowseContent() {
        setScene("idle");
        isBrowsingContent = true;
        // 橙色点头，紫色和黑色微微关注
        purple.style.transform = "skewX(-3deg) translateX(8px)";
        black.style.transform = "skewX(2deg) translateX(4px)";
        orange.style.animation = "gentleNod 2s ease-in-out 2";
        orange.style.transform = "";
        purpleEyes.style.left = "52px";
        purpleEyes.style.top = "42px";
        blackEyes.style.left = "30px";
        blackEyes.style.top = "30px";
        orangeEyes.style.left = "85px";
        orangeEyes.style.top = "88px";
        yellowEyes.style.left = "55px";
        yellowEyes.style.top = "38px";

        const po = calcPupilOffset(purpleEyeL, 4);
        purplePupilL.style.transform = `translate(${po.x}px,${po.y}px)`;
        purplePupilR.style.transform = `translate(${po.x}px,${po.y}px)`;

        sceneTransitionTimer = setTimeout(() => {
          isBrowsingContent = false;
          orange.style.animation = "";
          setScene("idle");
          updateCharacters();
        }, 4500);
      }

      function doInfoCheck() {
        setScene("idle");
        isInfoChecking = true;
        // 黄色专注核对，嘴巴轻微颤动
        yellow.style.animation = "";
        yellowMouth.style.animation = "lipQuiver 1.2s ease-in-out 3";
        // 紫色和黑色"侧头查看"
        purple.style.transform = "skewX(-4deg)";
        black.style.transform = "skewX(5deg)";
        orange.style.transform = "skewX(0deg)";

        purpleEyes.style.left = "40px";
        purpleEyes.style.top = "38px";
        blackEyes.style.left = "20px";
        blackEyes.style.top = "28px";
        orangeEyes.style.left = "78px";
        orangeEyes.style.top = "88px";
        yellowEyes.style.left = "46px";
        yellowEyes.style.top = "38px";

        const bo = calcPupilOffset(blackEyeL, 4);
        blackPupilL.style.transform = `translate(${bo.x}px,${bo.y}px)`;
        blackPupilR.style.transform = `translate(${bo.x}px,${bo.y}px)`;

        sceneTransitionTimer = setTimeout(() => {
          isInfoChecking = false;
          yellowMouth.style.animation = "";
          setScene("idle");
          updateCharacters();
        }, 4000);
      }

      // ---------- API: 编辑场景 ----------

      function doEditFocus() {
        setScene("editing");
        if (editFocusTimer) clearTimeout(editFocusTimer);
        updateCharacters();
      }

      function doEditBlur() {
        if (editFocusTimer) clearTimeout(editFocusTimer);
        yellow.style.animation = "";
        yellowMouth.style.animation = "";
        purple.style.height = "";
        setScene("idle");
        updateCharacters();
      }

      // ---------- API: 保存/提交 ----------

      function doSaveSuccess() {
        setScene("idle");
        stopShake();
        orangeMouth.classList.remove("visible");

        // 全体弹跳庆祝
        [purple, black, orange, yellow].forEach(el => {
          el.style.animation = "bounceUp 0.7s ease-out";
          el.style.transform = "";
        });
        // 重置黄色嘴
        yellowMouth.style.transform = "";
        yellowMouth.style.animation = "";

        sceneTransitionTimer = setTimeout(() => {
          [purple, black, orange, yellow].forEach(el => {
            el.style.animation = "";
          });
          setScene("idle");
          updateCharacters();
        }, 1000);
      }

      function doSaveError() {
        // 优先级高于其他场景
        if (sceneTransitionTimer) clearTimeout(sceneTransitionTimer);
        setScene("error");

        isErrorActive = true;
        orangeMouth.classList.remove("visible");
        updateCharacters();

        // 显示悲伤嘴
        setTimeout(() => {
          orangeMouth.classList.add("visible");
        }, 100);

        // 350ms 后摇头
        setTimeout(() => {
          triggerShake();
        }, 450);

        // 2500ms 恢复
        sceneTransitionTimer = setTimeout(() => {
          orangeMouth.classList.remove("visible");
          stopShake();
          isErrorActive = false;
          setScene("idle");
          updateCharacters();
        }, 2800);
      }

      // ---------- API: 页面切换 ----------

      function doNavSwitch() {
        setScene("idle");
        // 所有角色微微转向新方向（向右偏移再回到原位）
        purple.style.transition = "all 0.4s ease-in-out";
        black.style.transition = "all 0.4s ease-in-out";
        orange.style.transition = "all 0.4s ease-in-out";
        yellow.style.transition = "all 0.4s ease-in-out";

        purple.style.transform = "skewX(6deg) translateX(10px)";
        black.style.transform = "skewX(4deg) translateX(6px)";
        orange.style.transform = "skewX(5deg) translateX(8px)";
        yellow.style.transform = "skewX(3deg) translateX(5px)";

        purpleEyes.style.left = "55px";
        purpleEyes.style.top = "38px";
        blackEyes.style.left = "32px";
        blackEyes.style.top = "30px";
        orangeEyes.style.left = "90px";
        orangeEyes.style.top = "88px";
        yellowEyes.style.left = "58px";
        yellowEyes.style.top = "38px";

        const po = calcPupilOffset(purpleEyeL, 6);
        purplePupilL.style.transform = `translate(${po.x}px,${po.y}px)`;
        purplePupilR.style.transform = `translate(${po.x}px,${po.y}px)`;

        sceneTransitionTimer = setTimeout(() => {
          [purple, black, orange, yellow].forEach(el => {
            el.style.transition = "";
          });
          setScene("idle");
          updateCharacters();
        }, 800);
      }

      // ---------- API: 管线运行 ----------

      let pipelineTimer = null;

      function doPipelineRunning(running) {
        if (pipelineTimer) {
          clearTimeout(pipelineTimer);
          pipelineTimer = null;
        }
        isPipelineRunning = running;
        if (running) {
          setScene("pipeline");
          updateCharacters();
        } else {
          setScene("idle");
          updateCharacters();
        }
      }

      // ================================================================
      //  事件绑定（替换原密码输入场景的逻辑）
      //  绑定后当角色嵌入 config_ui.html 时自动响应场景事件
      // ================================================================

      // 页面切换监听
      document.addEventListener("click", (e) => {
        const navLink = e.target.closest("nav a, [data-page]");
        if (navLink) {
          doNavSwitch();
        }
      });

      // 编辑输入监听（适用于所有 textarea / input 聚焦）
      document.addEventListener("focusin", (e) => {
        const tag = e.target.tagName;
        if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") {
          doEditFocus();
        }
      });
      document.addEventListener("focusout", (e) => {
        const tag = e.target.tagName;
        if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") {
          doEditBlur();
        }
      });

      // 滚动监听
      let scrollTimerV = null;
      let lastScrollTop = 0;
      document.addEventListener("scroll", () => {
        const main = document.querySelector("main") || document.documentElement;
        const st = main.scrollTop || 0;
        scrollDirection = st > lastScrollTop ? 1 : st < lastScrollTop ? -1 : 0;
        lastScrollTop = st;
        if (scrollTimerV) clearTimeout(scrollTimerV);
        if (activeScene !== "editing" && !isErrorActive) {
          setScene("viewing");
          updateCharacters();
        }
        scrollTimerV = setTimeout(() => {
          scrollDirection = 0;
          if (!isErrorActive && !isPipelineRunning && activeScene !== "editing") {
            setScene("idle");
            updateCharacters();
          }
        }, 600);
      }, { passive: true });

      // 每次渲染完成后恢复 idle（用于查看场景的 scroll 归位）
      // 已在上方 scroll 监听中处理

      // 对外暴露 API
      window.__characters = {
        doScrollDown,
        doScrollUp,
        doBrowseContent,
        doInfoCheck,
        doEditFocus,
        doEditBlur,
        doSaveSuccess,
        doSaveError,
        doNavSwitch,
        doPipelineRunning,
        // 底层
        triggerShake,
        stopShake,
      };

      // 初始渲染
      updateCharacters();
    })();
  </script>
</body>
</html>
